<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Payment Method</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #f2f2f2;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #111;
    padding: 28px 16px 40px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 28px; letter-spacing: -0.5px; }
  .who { font-size: 26px; font-weight: 500; margin: 0 0 14px; }

  .option {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;
    height: 96px;
    padding: 0 18px;
    margin-bottom: 16px;
    background: #f7f7f7;
    border: 1.5px solid #e1e1e1;
    border-radius: 18px;
    cursor: pointer;
    overflow: hidden;
    transition: background .2s, border-color .2s;
  }
  .radio {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid #888;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s;
  }
  .radio::after {
    content: "";
    width: 18px; height: 18px;
    border-radius: 50%;
    background: transparent;
    transition: background .2s;
  }
  .label { font-size: 26px; font-weight: 700; }
  .label.muted { font-weight: 600; color: #333; }
  .logo {
    flex: 1;
    height: 56px;
    min-width: 0;
    object-fit: contain;
    mix-blend-mode: multiply; /* يخفي الخلفية البيضا بتاعة الصور */
    margin-right: 52px; /* يخلي اللوجو في النص بصريًا */
  }
  .bear {
    position: absolute;
    right: 8px; bottom: -6px;
    font-size: 78px;
    line-height: 1;
    display: none;
  }
  .hearts { position: absolute; right: 14px; top: 8px; color: #f48fb1; font-size: 20px; display: none; }

  .option.selected { background: #fce4ec; border-color: #f06292; }
  .option.selected .radio { border-color: #e91e63; }
  .option.selected .radio::after { background: #e91e63; }
  .option.selected .bear,
  .option.selected .hearts { display: block; }

  html, body { height: 100%; }
  body { padding: 0; background: #f2f2f2; }
  .phone { position: relative; width: 100%; min-height: 100vh; background: #f2f2f2; display: flex; flex-direction: column; }
  .statusbar { display: none; }
  .sysicons { display: flex; align-items: center; gap: 6px; }
  .appbar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #fff; border-bottom: 1px solid #e6e6e6; font-size: 18px; font-weight: 600; }
  .appbar .back { font-size: 26px; line-height: 1; color: #e91e63; }
  .screen { flex: 1; overflow-y: auto; padding: 24px 16px 110px; }
  .paybar { position: sticky; bottom: 0; padding: 12px 16px 22px; background: rgba(255,255,255,.95); border-top: 1px solid #e6e6e6; }
  .paybtn { width: 100%; border: 0; border-radius: 16px; padding: 17px; font-size: 19px; font-weight: 700; color: #fff; background: #e91e63; transition: transform .1s, opacity .2s; }
  .paybtn:active { transform: scale(.98); }
  .overlay { position: absolute; inset: 0; background: rgba(255,255,255,.96); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; z-index: 20; }
  .overlay.show { display: flex; }
  .spinner { width: 54px; height: 54px; border: 5px solid #f8bbd0; border-top-color: #e91e63; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .result-icon { font-size: 72px; }
  .result-title { font-size: 26px; font-weight: 700; margin: 12px 0 6px; }
  .result-sub { font-size: 18px; color: #555; margin-bottom: 24px; }
  .okbtn { border: 0; background: #e91e63; color: #fff; font-size: 17px; font-weight: 600; padding: 12px 34px; border-radius: 14px; }

  @media (min-width: 560px) {
    body { background: #d9d9de; display: flex; align-items: center; justify-content: center; }
    .phone { width: 390px; min-height: 0; height: 800px; border-radius: 46px; border: 10px solid #111; box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden; }
    .statusbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 8px; background: #fff; font-size: 15px; font-weight: 600; }
    .paybar { position: absolute; left: 0; right: 0; bottom: 0; }
  }

  .bear { font-size: 0; height: 100px; width: auto; right: 6px; bottom: -1px; pointer-events: none; }
  .option.selected { overflow: visible; }
  .option.selected .label { font-size: 24px; }

  .option.selected { position: relative; z-index: 3; }
  .option.selected .label { font-size: 23px; }
  .heart { font-size: 26px; line-height: 1; margin-left: -8px; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  .bear { height: 88px; right: 4px; bottom: -11px; filter: drop-shadow(0 4px 3px rgba(0,0,0,.25)); }

  .option.selected { gap: 14px; }
  .option.selected .label { font-size: 22px; }
  .heart { flex: none; margin-left: -6px; font-size: 0; }
  .bear { height: min(104px, calc((100vw - 32px) * 0.265)); right: 2px; bottom: -9px; }
  @media (min-width: 560px) { .bear { height: 98px; } }
  .heart { margin-left: -11px; }
  .screen { min-height: 0; }
  .wrap::after { content: ""; display: block; height: 24px; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: 100px; z-index: 30; background: #1c1c1e; color: #fff; padding: 14px 16px; border-radius: 16px; font-size: 16px; font-weight: 600; line-height: 1.4; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.3); opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .25s, transform .25s; }
  .toast.show { opacity: 1; transform: none; }
  @media (min-width: 560px) { .toast { position: absolute; } }
  .option.denied { background: #ffebee; border-color: #e53935; animation: shake .45s; }
  .option.denied .radio { border-color: #e53935; }
  @keyframes shake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)} }
  .bear.shake { animation: bearshake .5s; }
  @keyframes bearshake { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-6deg)} 40%{transform:rotate(6deg)} 60%{transform:rotate(-4deg)} 80%{transform:rotate(4deg)} }

  .overlay { background: #fff !important; }
  .rc-ring { stroke-dasharray: 227; stroke-dashoffset: 227; animation: draw .6s ease-out forwards; }
  .rc-mark { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .4s .5s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .result-title { margin-top: 22px; letter-spacing: -.3px; }
  .muted2 { color: #8a8a8e; font-size: 15px; }

  .overlay { position: fixed; }
  @media (min-width: 560px) { .overlay { position: absolute; } }
</style>
</head>

<div class="paybar"><button class="paybtn" id="pay">Pay now</button></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="ov"></div>
</div>

<script>
  const opts = document.querySelectorAll('[data-opt]');
  const toast = document.getElementById('toast');
  const msgs = [
    "Card declined. Husband is the only accepted payment method.",
    "Suspicious activity detected. Husband has been notified.",
    "Insufficient funds. Your balance: 0. Husband's balance: unlimited."
  ];
  let last = -1, t1, t2;
  opts.forEach(o => o.addEventListener('click', () => {
    if (o.hasAttribute('data-husband')) {
      opts.forEach(x => x.classList.remove('selected', 'denied'));
      o.classList.add('selected');
      return;
    }
    // pick a message different from the last one
    let i; do { i = Math.floor(Math.random() * msgs.length); } while (i === last);
    last = i;
    clearTimeout(t1); clearTimeout(t2);
    opts.forEach(x => x.classList.remove('denied'));
    void o.offsetWidth; o.classList.add('denied');
    const bear = document.querySelector('.bear');
    if (bear) { bear.classList.remove('shake'); void bear.offsetWidth; bear.classList.add('shake'); }
    toast.textContent = msgs[i];
    toast.classList.add('show');
    t1 = setTimeout(() => opts.forEach(x => x.classList.remove('denied')), 500);
    t2 = setTimeout(() => toast.classList.remove('show'), 2600);
  }));

  function tick(){ const d=new Date(); const c=document.getElementById('clock'); if(c) c.textContent=d.getHours()%12||12 + '' ; if(c) c.textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0'); }
  tick(); setInterval(tick, 20000);

  const ov = document.getElementById('ov');
  document.getElementById('pay').addEventListener('click', () => {
    const sel = document.querySelector('.option.selected');
    if (!sel) {
      toast.textContent = 'Please select a payment method.';
      toast.classList.add('show');
      clearTimeout(t2); t2 = setTimeout(() => toast.classList.remove('show'), 2000);
      return;
    }
    const isHusband = sel && sel.textContent.includes('Husband');
    ov.innerHTML = '<div class="spinner"></div><div class="result-sub" style="margin-top:20px">Processing...</div>';
    ov.classList.add('show');
    setTimeout(() => {
      ov.innerHTML = isHusband
        ? '<svg class="rc ok" viewBox="0 0 80 80" width="92" height="92"><circle class="rc-ring" cx="40" cy="40" r="36" fill="none" stroke="#2e9e5b" stroke-width="5"/><path class="rc-mark" d="M24 41l11 11 21-23" fill="none" stroke="#2e9e5b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="result-title">Payment approved</div><div class="result-sub">Paid by Husband<br><span class="muted2">No questions asked</span></div><button class="okbtn" id="ok">Done</button>'
        : '<svg class="rc no" viewBox="0 0 80 80" width="92" height="92"><circle class="rc-ring" cx="40" cy="40" r="36" fill="none" stroke="#d93025" stroke-width="5"/><path class="rc-mark" d="M28 28l24 24M52 28L28 52" fill="none" stroke="#d93025" stroke-width="6" stroke-linecap="round"/></svg><div class="result-title">Payment declined</div><div class="result-sub">Please select Husband</div><button class="okbtn" id="ok">Try again</button>';
      document.getElementById('ok').onclick = () => ov.classList.remove('show');
    }, 1400);
  });
</script>
